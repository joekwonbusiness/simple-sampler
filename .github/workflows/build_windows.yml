name: Build Windows x64 VST3

# Modified from NeuralNote's Windows release workflow for Simple Sampler, 2026.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vst3:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141
      CCACHE_VERSION: 4.14.1
      CCACHE_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore Vulkan SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Set up clang-cl, Vulkan, and ccache
        run: python .github/scripts/windows_tools.py

      - name: Restore generated soundfont
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: NeuralNote/Assets/SoundFont
          key: soundfont-${{ hashFiles('Tools/fetch_soundfont.py', 'Tools/make_soundfont.py') }}

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-x64-

      - name: Configure and build Release
        run: python .github/scripts/configure_and_build.py

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify and stage VST3 artifact
        shell: pwsh
        run: |
          $bundle = "build/SimpleSampler_artefacts/Release/VST3/Simple Sampler.vst3"
          $binary = "$bundle/Contents/x86_64-win/Simple Sampler.vst3"
          $moduleInfo = "$bundle/Contents/Resources/moduleinfo.json"

          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Missing x64 VST3 binary: $binary"
          }

          $metadata = Get-Content -Raw -LiteralPath $moduleInfo
          foreach ($expected in @('"Name": "Simple Sampler"', '"Vendor": "Simple Sampler"', '"Version": "0.1.0"')) {
            if (-not $metadata.Contains($expected)) {
              throw "moduleinfo.json does not contain $expected"
            }
          }

          $headers = & dumpbin /headers $binary
          if (-not ($headers -match '8664 machine \(x64\)')) {
            throw "VST3 binary is not x64"
          }

          New-Item -ItemType Directory -Path artifact/licenses -Force | Out-Null
          Copy-Item -LiteralPath $bundle -Destination artifact -Recurse
          Copy-Item -LiteralPath LICENSE -Destination artifact/licenses/Apache-2.0.txt
          Copy-Item -LiteralPath NOTICE -Destination artifact/licenses/NOTICE.txt
          Copy-Item -LiteralPath MODEL_LICENSE.md -Destination artifact/licenses/MODEL_LICENSE.md
          Copy-Item -LiteralPath Installers/license.txt -Destination artifact/licenses/THIRD_PARTY_NOTICES.txt
          Get-FileHash -Algorithm SHA256 -LiteralPath $binary

      - name: Upload installable VST3 bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Simple-Sampler-Windows-x64-VST3
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
